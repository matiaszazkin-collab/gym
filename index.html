<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171A">
<title>GYM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-64.png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Registro de progreso de pesos en el gimnasio.">

<style>
:root{
  --bg:#15171A; --surface:#1C1F24; --surface2:#242830; --border:#31363E;
  --borderStrong:#3D434C; --text:#F1EEE7; --dim:#9AA1AB; --faint:#6B7280;
  --iron:#E8543A; --steel:#5B8CA8; --ok:#7FA66B; --warn:#D9A441;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased}
::selection{background:#E8543A55}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--iron);outline-offset:2px}
input,select{width:100%;min-width:0;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font-family:var(--mono);font-size:15px;outline:none}
input:focus,select:focus{border-color:var(--iron)}
select{font-family:var(--body);cursor:pointer;appearance:none;padding-right:32px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%239AA1AB'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center}
option,optgroup{background:var(--surface2);color:var(--text)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.6);cursor:pointer}

header{padding:18px 18px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:8px;background:var(--iron);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.title{font-family:var(--display);font-size:20px;letter-spacing:.5px;text-transform:uppercase;line-height:1}
.sub{font-size:12px;color:var(--dim);margin-top:3px}
main{max-width:640px;width:100%;margin:0 auto;padding:16px 16px 104px;display:flex;flex-direction:column;gap:16px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.card.tight{padding:12px}
.row{display:flex;gap:12px}
.col{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.lg{gap:16px}
.stack.sm{gap:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim)}
.hint{font-size:12px;color:var(--faint)}
.err{font-size:13px;color:var(--iron)}
.eyebrow{font-family:var(--display);font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim)}

.btn{background:var(--iron);color:#fff;border:none;border-radius:8px;padding:12px 16px;font-family:var(--display);font-size:15px;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:var(--surface2);color:var(--dim)}
.btn.full{width:100%}
.icobtn{background:rgba(255,255,255,.06);color:var(--dim);border:1px solid var(--border);border-radius:6px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icobtn.danger{background:rgba(232,84,58,.12);color:var(--iron)}
.icobtn.ok{background:rgba(127,166,107,.14);color:var(--ok)}
.icobtn:hover{filter:brightness(1.2)}

.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.3px;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--dim);border:1px solid var(--border);white-space:nowrap}
.pill.iron{background:#E8543A22;color:var(--iron);border-color:#E8543A55}

.item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item.editing{border-color:var(--iron)}

/* listas sin cajitas: bandas de tono alternado */
.rowlist{display:flex;flex-direction:column;gap:0;margin:0 -16px}
.rowlist>.item{background:transparent;border:none;border-radius:0;padding:12px 16px}
.rowlist>.item:nth-child(odd){background:rgba(255,255,255,.018)}
.rowlist>.item:nth-child(even){background:rgba(255,255,255,.055)}
.rowlist>.item.editing{box-shadow:inset 3px 0 0 var(--iron)}
.item .name{font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{font-size:12px;color:var(--dim)}
.nums{font-family:var(--mono);font-size:13px;color:var(--dim);white-space:nowrap}
.actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.mini{width:66px;padding:6px 8px;font-size:13px}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 20px;color:var(--faint);gap:10px}
.empty .t{font-family:var(--display);font-size:16px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.empty .s{font-size:13px;max-width:280px}

.big{font-family:var(--display);font-size:26px;line-height:1}
.big span{font-size:14px;color:var(--dim);margin-left:4px}
.kv{font-size:11px;color:var(--faint);margin-top:6px;font-family:var(--mono)}
.when{font-size:11px;color:var(--faint);margin-top:2px}

.delta{display:flex;align-items:center;gap:8px}
.rings{position:relative;width:28px;height:28px;flex-shrink:0}
.rings i{position:absolute;border-radius:50%;border:2px solid currentColor;top:50%;left:50%;transform:translate(-50%,-50%)}
.delta .val{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:14px;font-weight:600}

.record{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px;padding-left:2px}
.record b{font-family:var(--mono);color:var(--text);font-weight:400}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav button{flex:1;background:transparent;border:none;border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim)}
nav button.active{background:rgba(232,84,58,.12);color:var(--iron)}
nav button span{font-family:var(--display);font-size:11px;letter-spacing:.4px;text-transform:uppercase}

.toast{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ok);flex-shrink:0}
.legend{display:flex;gap:14px;font-size:11px;color:var(--faint);padding:2px 0 0 4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chartbox{margin-top:6px}
svg.chart{width:100%;height:auto;display:block}

/* aviso de estancamiento */
.warn{display:flex;gap:9px;align-items:flex-start;background:rgba(217,164,65,.10);border:1px solid rgba(217,164,65,.34);border-radius:10px;padding:11px 13px;color:var(--warn);font-size:13px;line-height:1.45}
.warn svg{flex-shrink:0;margin-top:1px}
.warn b{font-family:var(--mono);font-weight:400}

/* progreso: bandas por ejercicio */
.exlist{display:flex;flex-direction:column;gap:0;margin:0 -16px}
.exblock{padding:14px 16px 16px}
.exblock:nth-child(odd){background:rgba(255,255,255,.018)}
.exblock:nth-child(even){background:rgba(255,255,255,.055)}
.statline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.metaline{font-size:11px;color:var(--faint);font-family:var(--mono);margin-top:6px;line-height:1.6}
.metaline svg{vertical-align:-2px;margin-right:2px}
.stickyfilters{position:sticky;top:0;z-index:9;background:var(--bg);margin:-16px -16px 0;padding:10px 16px;border-bottom:1px solid var(--border)}
.stickyfilters select{padding-top:8px;padding-bottom:8px;font-size:14px}

/* selector de ejercicio con grupos plegables */
.pickbtn{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;display:flex;align-items:center;gap:9px;text-align:left}
.pickbtn:hover{border-color:var(--borderStrong)}
.pickbtn .pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.pickbtn .chev{color:var(--dim);display:flex;flex-shrink:0}
.excomment{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--dim);line-height:1.4;padding:2px 2px 0}
.excomment svg{flex-shrink:0;margin-top:2px;color:var(--faint)}
.acc{display:flex;flex-direction:column;gap:7px}
.accgroup{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface2)}
.accgroup.on{border-color:var(--borderStrong)}
.acchead{width:100%;background:transparent;border:none;padding:11px 12px;display:flex;align-items:center;gap:9px;color:var(--text);font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:.3px}
.acchead .n{flex:1;text-align:left;min-width:0}
.acchead .c{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:0}
.acchead .chev{display:flex;color:var(--dim);transition:transform .15s}
.accgroup.on .acchead{color:var(--iron)}
.accgroup.on .acchead .chev{transform:rotate(90deg);color:var(--iron)}
.accbody{display:flex;flex-direction:column;border-top:1px solid var(--border)}
.accitem{background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.05);padding:10px 12px;display:flex;align-items:center;gap:9px;color:var(--text);text-align:left;font-size:14px}
.accitem:last-child{border-bottom:none}
.accitem.sel{background:rgba(232,84,58,.13);color:var(--iron)}
.accitem .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accitem .ty{font-size:11px;color:var(--faint);flex-shrink:0}
.accitem .w{font-family:var(--mono);font-size:12px;color:var(--dim);flex-shrink:0}
.filebar{display:flex;gap:10px}
.filebar .btn{flex:1;font-size:13px;padding:10px 12px}

.segbar{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:4px}
.segbar button{flex:1;background:transparent;border:none;border-radius:7px;padding:8px 6px;color:var(--dim);font-family:var(--display);font-size:13px;letter-spacing:.4px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px}
.segbar button.on{background:var(--surface);color:var(--iron);box-shadow:0 1px 2px rgba(0,0,0,.25)}

.calhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.calhead .m{font-family:var(--display);font-size:16px;letter-spacing:.5px;text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{text-align:center;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--faint);padding-bottom:2px}
.cal .pad{aspect-ratio:1}
.cal .day{aspect-ratio:1;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--faint);font-family:var(--mono);font-size:14px;display:flex;align-items:center;justify-content:center;padding:0}
.cal .day.has{background:var(--iron);border-color:var(--iron);color:#fff;font-weight:700}
.cal .day.today{border-color:var(--steel)}
.cal .day.sel{background:var(--iron);color:#fff;border-color:var(--text)}
.daygroup{font-family:var(--display);font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim);margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.daygroup:before{content:"";height:1px;flex:0 0 14px;background:var(--borderStrong)}

.overlay{position:fixed;inset:0;background:rgba(9,10,12,.72);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.modal{background:var(--surface);border:1px solid var(--borderStrong);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:82vh;display:flex;flex-direction:column;animation:slideUp .18s ease-out}
@keyframes slideUp{from{transform:translateY(18px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modalhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 16px 12px;border-bottom:1px solid var(--border)}
.modaltitle{font-family:var(--display);font-size:17px;letter-spacing:.4px;text-transform:uppercase;line-height:1.15}
.modalbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:560px){.overlay{align-items:center;padding:20px}.modal{border-radius:16px}}

.grouphead{font-family:var(--display);font-size:15px;letter-spacing:.4px;text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>

<header>
  <div class="logo" id="logo"></div>
  <div style="flex:1;min-width:0">
    <div class="title">GYM</div>
    <div class="sub">Registro de progreso en el gimnasio</div>
  </div>
  <div class="toast" id="toast" hidden></div>
</header>

<main id="main"></main>

<nav id="nav"></nav>

<script>
"use strict";

/* ---------- iconos (paths de lucide) ---------- */
const ICON = {
  dumbbell:'<path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/>',
  library:'<path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/>',
  clipboard:'<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>',
  sliders:'<path d="M21 4H14"/><path d="M10 4H3"/><path d="M21 12H12"/><path d="M8 12H3"/><path d="M21 20H16"/><path d="M12 20H3"/><path d="M14 2v4"/><path d="M8 10v4"/><path d="M16 18v4"/>',
  plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  trash:'<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/>',
  pencil:'<path d="M12 20h9"/><path d="m16.5 3.5 4 4L7 21l-4 1 1-4Z"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  trophy:'<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
  up:'<path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/>',
  down:'<path d="M16 17h6v-6"/><path d="m22 17-8.5-8.5-5 5L2 7"/>',
  minus:'<path d="M5 12h14"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>',
  chart:'<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/>',
  calendar:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/>',
  list:'<path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  chevL:'<path d="m15 18-6-6 6-6"/>',
  chevD:'<path d="m6 9 6 6 6-6"/>',
  note:'<path d="M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z"/><path d="M9 7h6"/><path d="M9 11h6"/><path d="M9 15h3"/>',
  chevR:'<path d="m9 18 6-6-6-6"/>'
};
function ico(name, size, sw){
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+(size||16)+'" height="'+(size||16)+
    '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(sw||2)+
    '" stroke-linecap="round" stroke-linejoin="round">'+ICON[name]+'</svg>';
}

/* ---------- datos base ---------- */
const MUSCLE_GROUPS=["Piernas","Pecho","Espalda","Hombros","Bíceps","Tríceps","Antebrazo","Core","Glúteos"];
const TYPES=["Mancuerna","Máquina","Barra","Peso libre","Kettlebell"];
const SEED=[
["ex_sentadilla","Sentadilla","Piernas","Barra"],["ex_sillon_cuadriceps","Sillón cuádriceps","Piernas","Máquina"],
["ex_isquiotibiales","Isquiotibiales","Piernas","Máquina"],["ex_peso_muerto","Peso muerto","Piernas","Barra"],
["ex_gemelos","Gemelos","Piernas","Máquina"],["ex_tibiales","Tibiales","Piernas","Kettlebell"],
["ex_hack","Hack","Piernas","Máquina"],["ex_sentadilla_bulgara","Sentadilla búlgara","Piernas","Kettlebell"],
["ex_banco_plano_barra","Banco plano","Pecho","Barra"],["ex_banco_inclinado","Banco inclinado","Pecho","Barra"],
["ex_banco_plano_mancuerna","Banco plano","Pecho","Mancuerna"],["ex_apertura_inclinada","Apertura inclinada","Pecho","Mancuerna"],
["ex_fondos","Fondos","Tríceps","Peso libre"],["ex_jalon_triceps_cuerda","Jalón de tríceps con cuerda","Tríceps","Máquina"],
["ex_extension_trasnuca","Extensión trasnuca con cuerda","Tríceps","Máquina"],["ex_jalon_triceps_un_brazo","Jalón tríceps un brazo","Tríceps","Máquina"],
["ex_empuje_triceps_banco","Empuje tríceps en banco plano","Tríceps","Barra"],
["ex_polea_al_pecho","Polea al pecho","Espalda","Máquina"],["ex_polea_a_la_espalda","Polea a la espalda","Espalda","Máquina"],
["ex_dominadas","Dominadas","Espalda","Peso libre"],["ex_remo","Remo","Espalda","Máquina"],
["ex_remo_inclinado","Remo inclinado","Espalda","Máquina"],
["ex_curl_abierto","Curl abierto","Bíceps","Barra"],["ex_curl_martillo","Curl martillo","Bíceps","Mancuerna"],
["ex_curl_cerrado","Curl cerrado","Bíceps","Barra"],["ex_curl_inclinado","Curl inclinado","Bíceps","Mancuerna"],
["ex_vuelos_laterales","Vuelos laterales","Hombros","Mancuerna"],["ex_vuelos_frontales","Vuelos frontales","Hombros","Mancuerna"],
["ex_quemeimporta","Quemeimporta","Hombros","Mancuerna"],["ex_arnold","Arnold","Hombros","Mancuerna"],
["ex_flexion_muneca","Flexión de muñeca","Antebrazo","Mancuerna"],["ex_extension_muneca","Extensión de muñeca","Antebrazo","Mancuerna"]
].map(a=>({id:a[0],name:a[1],muscleGroup:a[2],type:a[3],comments:""}));

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function uid(p){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);}
function num(v){if(v===""||v==null)return null;const n=parseFloat(v);return isFinite(n)?n:null;}
function peak(e){if(!e)return null;if(e.max!=null)return e.max;if(e.avg!=null)return e.avg;return null;}
function fmtDate(iso){const d=new Date(iso);return isNaN(d)?"-":d.toLocaleDateString("es-AR",{day:"2-digit",month:"short",year:"numeric"});}
function fmtShort(iso){const d=new Date(iso);return isNaN(d)?"-":d.toLocaleDateString("es-AR",{day:"2-digit",month:"short"});}
function since(iso){const t=new Date(iso).getTime();if(isNaN(t))return"";
  const d=Math.round((Date.now()-t)/86400000);
  if(d<=0)return"hoy"; if(d===1)return"ayer"; if(d<7)return"hace "+d+" días";
  const w=Math.round(d/7); return w===1?"hace 1 semana":"hace "+w+" semanas";}
function today(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function pad2(n){return(n<10?"0":"")+n;}
function dayKey(iso){const d=new Date(iso);return isNaN(d)?"":d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function monthKey(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1);}
function monthLabel(mk){const p=mk.split("-");const d=new Date(+p[0],+p[1]-1,1);
  const s=d.toLocaleDateString("es-AR",{month:"long",year:"numeric"});return s.charAt(0).toUpperCase()+s.slice(1);}
function shiftMonth(mk,delta){const p=mk.split("-");return monthKey(new Date(+p[0],+p[1]-1+delta,1));}
function dayLabel(dk){const p=dk.split("-");const d=new Date(+p[0],+p[1]-1,+p[2]);
  const s=d.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});return s.charAt(0).toUpperCase()+s.slice(1);}
function dateToISO(v){const d=new Date(v+"T12:00:00");return isNaN(d)?new Date().toISOString():d.toISOString();}
function label(ex){if(!ex)return"Ejercicio eliminado";
  const dup=S.exercises.some(o=>o.id!==ex.id&&o.name===ex.name);
  return dup?ex.name+" ("+ex.type+")":ex.name;}
function byId(id){return S.exercises.find(e=>e.id===id)||null;}

const KEY_EX="cdf.exercises", KEY_EN="cdf.entries";
let store;
try{localStorage.setItem("cdf.test","1");localStorage.removeItem("cdf.test");store=localStorage;}
catch(e){const m={};store={getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=v;}};}

  tab:"carga",
  exercises:[],
  entries:[],
  form:{exerciseId:"",avg:"",max:"",date:today()},
  lib:{editingId:null,name:"",muscleGroup:MUSCLE_GROUPS[0],type:TYPES[0],comments:""},
  reg:{filterId:"",editingId:"",eAvg:"",eMax:"",view:"lista",month:monthKey(new Date()),day:""},
  vis:{group:"Todos",exerciseId:""},

function load(){
  let ex=null,en=null;
  try{ex=JSON.parse(store.getItem(KEY_EX));}catch(e){}
  try{en=JSON.parse(store.getItem(KEY_EN));}catch(e){}
  S.exercises=(Array.isArray(ex)&&ex.length)?ex:SEED.slice();
  S.entries=Array.isArray(en)?en:[];
  if(!Array.isArray(ex)||!ex.length)save("ex");
}
function save(what){
  try{
    if(what!=="en")store.setItem(KEY_EX,JSON.stringify(S.exercises));
    if(what!=="ex")store.setItem(KEY_EN,JSON.stringify(S.entries));
    flash();
  }catch(e){alert("No se pudo guardar. Puede que el almacenamiento del navegador esté lleno o bloqueado.");}
}
let flashT;
function flash(){
  const t=$("#toast"); t.hidden=false; t.innerHTML=ico("check",12)+" Guardado";
  clearTimeout(flashT); flashT=setTimeout(()=>{t.hidden=true;},1600);
}

/* ---------- pestaña Carga ---------- */
/* última vez que el peso subió respecto de todo lo anterior */
const STALL_DAYS=14;
function stall(exId){
  const list=S.entries.filter(e=>e.exerciseId===exId&&peak(e)!=null)
    .sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
  if(!list.length)return null;
  let best=-Infinity,bestTs=null;
  list.forEach(e=>{const v=peak(e);if(v>best){best=v;bestTs=e.timestamp;}});
  const days=Math.floor((Date.now()-new Date(bestTs).getTime())/86400000);
  return {days:days,weight:best,ts:bestTs,stalled:days>STALL_DAYS,n:list.length};
}

function viewCarga(){
  if(!S.exercises.length)return empty("library","No hay ejercicios","Agregá ejercicios en la pestaña Biblioteca para poder cargar pesos.");
  if(!S.form.exerciseId||!byId(S.form.exerciseId))S.form.exerciseId=S.exercises[0].id;

  const hist=S.entries.filter(e=>e.exerciseId===S.form.exerciseId)
    .sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  const vals=hist.map(peak).filter(v=>v!=null);
  const record=vals.length?Math.max.apply(null,vals):null;

  const exSel=byId(S.form.exerciseId);
  let h='<div class="card stack lg">'
    + '<div class="field"><span>Ejercicio</span>'
    +   '<button class="pickbtn" data-act="openPick">'
    +     '<span class="pill iron">'+esc(exSel.muscleGroup)+'</span>'
    +     '<span class="pname">'+esc(label(exSel))+'</span>'
    +     '<span class="chev">'+ico("chevD",16)+'</span></button>'
    +   (exSel.comments?'<div class="excomment">'+ico("note",13)+esc(exSel.comments)+'</div>':'')
    +   '</div>'
    + '<div class="row"><div class="col">'
    + field("Peso promedio (kg)",'<input type="number" inputmode="decimal" step="0.5" min="0" placeholder="0" value="'+esc(S.form.avg)+'" data-bind="form.avg" data-enter="add">')
    + '</div><div class="col">'
    + field("Peso máximo (kg)",'<input type="number" inputmode="decimal" step="0.5" min="0" placeholder="0" value="'+esc(S.form.max)+'" data-bind="form.max" data-enter="add">')
    + '</div></div>'
    + field("Fecha",'<input type="date" value="'+esc(S.form.date)+'" max="'+today()+'" data-bind="form.date">')
    + '<div class="hint">Podés completar solo uno de los dos pesos.</div>'
    + (S.error?'<div class="err">'+esc(S.error)+'</div>':'')
    + '<button class="btn full" data-act="add">'+ico("plus",16)+'Cargar</button>'
    + '</div>';

  const st=stall(S.form.exerciseId);
  if(st&&st.stalled){
    const q=since(st.ts), qc=q.charAt(0).toUpperCase()+q.slice(1);
    h+='<div class="warn">'+ico("alert",16)
      +'<div>'+qc+' que no subís el peso en este ejercicio. Tu mejor marca sigue siendo <b>'+st.weight+' kg</b> ('+fmtShort(st.ts)+').</div></div>';
  }else if(record!=null){
    h+='<div class="record">'+ico("trophy",15)+'Récord en este ejercicio: <b>'+record+' kg</b></div>';
  }

  if(hist.length){
    h+='<div><div class="eyebrow" style="margin-bottom:8px">Últimas cargas</div><div class="stack sm">'
      + hist.slice(0,3).map(r=>'<div class="item"><span class="meta">'+fmtDate(r.timestamp)+'</span>'
      + '<span class="nums">'+(r.avg!=null?"prom "+r.avg:"—")+' · '+(r.max!=null?"máx "+r.max:"—")+'</span></div>').join("")
      + '</div></div>';
  }
  return h;
}

/* selector: grupos musculares plegables (modo "form" en Carga, "filter" en Registro) */
function pickerModal(){
  const P=S.pick, filter=P.mode==="filter";
  const cur=filter?S.reg.filterId:S.form.exerciseId;
  const pool=filter?S.exercises.filter(ex=>S.entries.some(e=>e.exerciseId===ex.id)):S.exercises;
  const byGroup={};
  pool.forEach(e=>{(byGroup[e.muscleGroup]=byGroup[e.muscleGroup]||[]).push(e);});
  const groups=MUSCLE_GROUPS.filter(g=>byGroup[g]&&byGroup[g].length)
    .concat(Object.keys(byGroup).filter(g=>MUSCLE_GROUPS.indexOf(g)<0).sort());

  let body=filter
    ? '<div class="accgroup"><button class="accitem'+(cur?"":" sel")+'" data-act="pickEx" data-id="__all">'
      +'<span class="t">Todos los ejercicios</span>'+(cur?'':ico("check",14))+'</button></div>'
    : '';

  body+=groups.map(g=>{
    const on=P.group===g, items=byGroup[g].slice().sort((a,b)=>a.name.localeCompare(b.name));
    let s='<div class="accgroup'+(on?" on":"")+'">'
      +'<button class="acchead" data-act="accGroup" data-id="'+esc(g)+'">'
      +'<span class="chev">'+ico("chevR",15)+'</span>'
      +'<span class="n">'+esc(g)+'</span>'
      +'<span class="c">'+items.length+'</span></button>';
    if(on){
      s+='<div class="accbody">'+items.map(ex=>{
        let right="";
        if(filter){
          const n=S.entries.filter(e=>e.exerciseId===ex.id).length;
          right='<span class="w">'+n+'</span>';
        }else{
          const vals=S.entries.filter(e=>e.exerciseId===ex.id).map(peak).filter(v=>v!=null);
          if(vals.length)right='<span class="w">'+Math.max.apply(null,vals)+' kg</span>';
        }
        return '<button class="accitem'+(ex.id===cur?" sel":"")+'" data-act="pickEx" data-id="'+ex.id+'">'
          +'<span class="t">'+esc(ex.name)+'</span>'
          +'<span class="ty">'+esc(ex.type)+'</span>'+right
          +(ex.id===cur?ico("check",14):'')+'</button>';
      }).join("")+'</div>';
    }
    return s+'</div>';
  }).join("");

  return '<div class="overlay" data-act="closePick"><div class="modal" data-stop="1">'
    +'<div class="modalhead"><div style="min-width:0">'
    +'<div class="modaltitle">'+(filter?"Filtrar por ejercicio":"Elegí el ejercicio")+'</div>'
    +'<div class="hint">Tocá un grupo muscular para desplegarlo.</div></div>'
    +'<button class="icobtn" data-act="closePick">'+ico("x",15)+'</button></div>'
    +'<div class="modalbody"><div class="acc">'+body+'</div></div></div></div>';
}

function addEntry(){
  const a=num(S.form.avg),m=num(S.form.max);
  S.error="";
  if(!S.form.exerciseId){S.error="Elegí un ejercicio.";return render();}
  if(a==null&&m==null){S.error="Ingresá al menos un peso: promedio o máximo.";return render();}
  if((a!=null&&a<0)||(m!=null&&m<0)){S.error="Los pesos no pueden ser negativos.";return render();}
  if(a!=null&&m!=null&&m<a){S.error="El máximo no puede ser menor que el promedio.";return render();}
  S.entries.push({id:uid("en"),exerciseId:S.form.exerciseId,avg:a,max:m,timestamp:dateToISO(S.form.date)});
  S.form.avg="";S.form.max="";
  save("en");render();
}

function saveEx(){
  const L=S.lib, name=(L.name||"").trim();
  if(!name){S.libError="Ponele un nombre al ejercicio.";return render();}
  const dup=S.exercises.some(e=>e.id!==L.editingId&&e.name.toLowerCase()===name.toLowerCase()&&e.type===L.type);
  if(dup){S.libError="Ya existe un ejercicio con ese nombre y tipo.";return render();}
  S.libError="";
  if(L.editingId){
    S.exercises=S.exercises.map(e=>e.id===L.editingId?{...e,name:name,muscleGroup:L.muscleGroup,type:L.type,comments:L.comments}:e);
  }else{
    S.exercises.push({id:uid("ex"),name:name,muscleGroup:L.muscleGroup,type:L.type,comments:L.comments});
  }
  cancelEx();save("ex");render();
}
function cancelEx(){S.lib={editingId:null,name:"",muscleGroup:MUSCLE_GROUPS[0],type:TYPES[0],comments:""};S.libError="";}

const DOW=["Lu","Ma","Mi","Ju","Vi","Sá","Do"];

function calendarBody(list){
  const R=S.reg;

  /* agrupo por día */
  const byDay={};
  list.forEach(e=>{const k=dayKey(e.timestamp); if(k)(byDay[k]=byDay[k]||[]).push(e);});

  /* si el día elegido ya no tiene registros, lo suelto */
  if(R.day&&!byDay[R.day])R.day="";

  const p=R.month.split("-"), y=+p[0], m=+p[1]-1;
  const first=new Date(y,m,1), daysInMonth=new Date(y,m+1,0).getDate();
  const offset=(first.getDay()+6)%7;               // lunes primero
  const todayKey=dayKey(new Date().toISOString());

  let cells=DOW.map(d=>'<div class="dow">'+d+'</div>').join("");
  for(let i=0;i<offset;i++)cells+='<div class="pad"></div>';
  let inMonth=0;
  for(let d=1;d<=daysInMonth;d++){
    const k=y+"-"+pad2(m+1)+"-"+pad2(d);
    const has=!!byDay[k]; if(has)inMonth+=byDay[k].length;
    const cls="day"+(has?" has":"")+(k===todayKey?" today":"")+(k===R.day?" sel":"");
    cells+='<button class="'+cls+'"'+(has?' data-act="pickDay" data-id="'+k+'"':' disabled')+'>'
      +'<span>'+d+'</span></button>';
  }

  let h='<div class="card">'
    + '<div class="calhead">'
    +   '<button class="icobtn" data-act="prevMonth">'+ico("chevL",15)+'</button>'
    +   '<div class="m">'+esc(monthLabel(R.month))+'</div>'
    +   '<button class="icobtn" data-act="nextMonth">'+ico("chevR",15)+'</button>'
    + '</div>'
    + '<div class="cal">'+cells+'</div>'
    + '<div class="hint" style="text-align:center;margin-top:12px">'
    +   (inMonth?inMonth+' '+(inMonth===1?"registro":"registros")+' este mes · tocá un día para ver qué hiciste':'Sin registros en este mes')
    + '</div></div>';

  /* todo el mes agrupado por fecha */
  const keys=Object.keys(byDay).filter(k=>k.slice(0,7)===R.month).sort().reverse();
  h+=keys.map(k=>'<div class="daygroup">'+esc(dayLabel(k))
      +'<span class="hint" style="text-transform:none;letter-spacing:0">'+byDay[k].length+'</span></div>'
      +'<div class="rowlist">'+byDay[k].map(e=>entryRow(e,false)).join("")+'</div>').join("");

  /* popup del día elegido */
  if(R.day&&byDay[R.day]){
    const rows=byDay[R.day];
    const vals=rows.map(peak).filter(v=>v!=null);
    const tope=vals.length?Math.max.apply(null,vals):null;
    h+='<div class="overlay" data-act="closeDay"><div class="modal" data-stop="1">'
      +'<div class="modalhead"><div style="min-width:0">'
      +'<div class="modaltitle">'+esc(dayLabel(R.day))+'</div>'
      +'<div class="hint">'+rows.length+' '+(rows.length===1?"ejercicio":"ejercicios")
      +(tope!=null?' · tope '+tope+' kg':'')+'</div></div>'
      +'<button class="icobtn" data-act="closeDay">'+ico("x",15)+'</button></div>'
      +'<div class="modalbody"><div class="rowlist">'+rows.map(e=>entryRow(e,false)).join("")+'</div></div>'
      +'</div></div>';
  }
  return h;
}

/* ---------- pestaña Progreso ---------- */
function chart(entries){
  const W=640,H=185,pl=38,pr=12,pt=10,pb=26;
  const n=entries.length;
  const all=[];entries.forEach(e=>{if(e.avg!=null)all.push(e.avg);if(e.max!=null)all.push(e.max);});
  let lo=Math.min.apply(null,all),hi=Math.max.apply(null,all);
  if(lo===hi){lo=lo-2.5;hi=hi+2.5;}
  const pad=(hi-lo)*0.12;lo-=pad;hi+=pad;lo=Math.max(0,lo);
  const X=i=>n===1?(pl+(W-pl-pr)/2):pl+i*(W-pl-pr)/(n-1);
  const Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);

  let g="";
  for(let i=0;i<=4;i++){
    const v=hi-(hi-lo)*i/4, y=Y(v);
    g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#31363E" stroke-dasharray="3 3"/>'
      +'<text x="'+(pl-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" fill="#9AA1AB" font-size="11" font-family="Inter,sans-serif">'+Math.round(v)+'</text>';
  }
  const step=Math.max(1,Math.ceil(n/6));
  entries.forEach((e,i)=>{
    if(i%step===0||i===n-1)
      g+='<text x="'+X(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" fill="#9AA1AB" font-size="11" font-family="Inter,sans-serif">'+fmtShort(e.timestamp)+'</text>';
  });

  function serie(key,color){
    const pts=[];entries.forEach((e,i)=>{if(e[key]!=null)pts.push([X(i),Y(e[key])]);});
    if(!pts.length)return"";
    let s="";
    if(pts.length>1)s+='<polyline fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" points="'+pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+'"/>';
    s+=pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" fill="'+color+'"/>').join("");
    return s;
  }
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'
    +g+serie("avg","#5B8CA8")+serie("max","#E8543A")+'</svg>';
}

function viewProgreso(){
  const V=S.vis;
  const avail=S.exercises.filter(e=>V.group==="Todos"||e.muscleGroup===V.group).sort((a,b)=>a.name.localeCompare(b.name));
  if(V.exerciseId&&!avail.some(e=>e.id===V.exerciseId))V.exerciseId="";
  const allLabel=V.group==="Todos"?"Elegir ejercicio":"Todos los de "+V.group;

  let h='<div class="stickyfilters"><div class="row">'
    + '<div class="col"><select data-bind="vis.group" data-render="1"><option value="Todos"'+(V.group==="Todos"?" selected":"")+'>Todos los grupos</option>'
      + MUSCLE_GROUPS.map(m=>'<option'+(m===V.group?" selected":"")+'>'+m+'</option>').join("")+'</select></div>'
    + '<div class="col"><select data-bind="vis.exerciseId" data-render="1"><option value="">'+esc(allLabel)+'</option>'
      + avail.map(e=>'<option value="'+e.id+'"'+(e.id===V.exerciseId?" selected":"")+'>'+esc(label(e))+'</option>').join("")+'</select></div>'
    + '</div></div>';

  /* un ejercicio puntual */
  if(V.exerciseId){
    const ex=byId(V.exerciseId);
    return h+'<div class="exlist"><div class="exblock">'
      +'<div class="grouphead">'+esc(label(ex))+'<span class="pill">'+esc(ex.type)+'</span></div>'
      +dashboard(V.exerciseId,false)+'</div></div>';
  }

  /* grupo entero: un bloque por ejercicio con cargas */
  if(V.group!=="Todos"){
    const withData=avail.filter(ex=>S.entries.some(e=>e.exerciseId===ex.id));
    if(!withData.length)return h+empty("dumbbell","Sin cargas en "+V.group,"Todavía no cargaste pesos en ningún ejercicio de este grupo.");
    return h+'<div class="exlist">'+withData.map(ex=>'<div class="exblock">'
      +'<div class="grouphead">'+esc(label(ex))+'<span class="pill">'+esc(ex.type)+'</span></div>'
      +dashboard(ex.id,true)+'</div>').join("")+'</div>';
  }

  return h+empty("chart","Elegí qué ver","Elegí un grupo muscular para ver todos sus ejercicios, o un ejercicio puntual para su evolución.");
}

function dashboard(exId,compact){
  let h="";
  const list=S.entries.filter(e=>e.exerciseId===exId).sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
  if(!list.length)return empty("dumbbell","Sin cargas todavía","Todavía no cargaste pesos para este ejercicio.");

  const cur=list[list.length-1], prev=list[list.length-2]||null;
  const cp=peak(cur), pp=peak(prev);
  const delta=(cp!=null&&pp!=null)?Math.round((cp-pp)*10)/10:null;
  const vals=list.map(peak).filter(v=>v!=null);
  const record=vals.length?Math.max.apply(null,vals):null;

  h+='<div class="statline"><div class="big">'+(cp!=null?cp:"—")+'<span>kg</span></div>';

  if(delta!=null){
    const up=delta>0,flat=delta===0;
    const color=flat?"var(--faint)":up?"var(--ok)":"var(--steel)";
    const rings=flat?1:Math.min(3,Math.max(1,Math.ceil(Math.abs(delta)/2.5)));
    let r="";for(let i=0;i<rings;i++){const s=28-i*7;r+='<i style="width:'+s+'px;height:'+s+'px;opacity:'+(0.9-i*0.25)+'"></i>';}
    h+='<div class="delta" style="color:'+color+'">'
      +'<div class="rings">'+r+'</div>'
      +'<div class="val">'+ico(flat?"minus":up?"up":"down",14)+(flat?"sin cambios":(up?"+":"")+delta+" kg")+'</div></div>'
      +'<span class="hint">vs. anterior</span>';
  }
  h+='</div>';

  h+='<div class="metaline">prom '+(cur.avg!=null?cur.avg:"—")+' · máx '+(cur.max!=null?cur.max:"—")+' · '+fmtShort(cur.timestamp)
    +(record!=null?' · '+ico("trophy",12)+'récord '+record+' kg':'')
    +' · '+list.length+' '+(list.length===1?"reg.":"regs.")+'</div>';

  if(list.length>1||!compact){
    h+='<div class="chartbox">'+chart(list)
      +'<div class="legend"><span><i style="background:#5B8CA8"></i>Promedio</span><span><i style="background:#E8543A"></i>Máximo</span></div></div>';
  }
  return h;
}

/* ---------- render ---------- */
const TABS=[["carga","Carga","dumbbell"],["biblioteca","Biblioteca","library"],["registro","Registro","clipboard"],["progreso","Progreso","chart"]];
function render(){
  $("#logo").innerHTML=ico("dumbbell",18,2.2);
  $("#main").innerHTML = (
    S.tab==="carga"?viewCarga():
    S.tab==="biblioteca"?viewBiblioteca():
    S.tab==="registro"?viewRegistro():viewProgreso()
  ) + (S.pick.open?pickerModal():"");
  $("#nav").innerHTML=TABS.map(t=>'<button data-tab="'+t[0]+'"'+(S.tab===t[0]?' class="active"':'')+'>'
    +ico(t[2],19,S.tab===t[0]?2.4:2)+'<span>'+t[1]+'</span></button>').join("");
  const open=S.pick.open||(S.tab==="registro"&&S.reg.view==="calendario"&&!!S.reg.day);
  document.body.style.overflow=open?"hidden":"";
}

/* ---------- eventos ---------- */
function setPath(path,value){
  const p=path.split(".");
  if(p.length===1)S[p[0]]=value; else S[p[0]][p[1]]=value;
}
document.addEventListener("input",e=>{
  const b=e.target.getAttribute&&e.target.getAttribute("data-bind");
  if(b)setPath(b,e.target.value);
});
document.addEventListener("change",e=>{
  const b=e.target.getAttribute&&e.target.getAttribute("data-bind");
  if(b){setPath(b,e.target.value); if(e.target.hasAttribute("data-render"))render();}
  if(e.target.id==="fileInput"&&e.target.files[0])readBackup(e.target.files[0]);
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.pick.open){S.pick.open=false;render();return;}
  if(e.key==="Escape"&&S.reg.day){S.reg.day="";S.reg.editingId="";S.confirm=null;render();return;}
  if(e.key!=="Enter")return;
  const a=e.target.getAttribute&&e.target.getAttribute("data-enter");
  if(!a)return;
  e.preventDefault();
  const b=e.target.getAttribute("data-bind"); if(b)setPath(b,e.target.value);
  if(a==="add")addEntry(); else if(a==="saveEx")saveEx();
});
document.addEventListener("click",e=>{
  const nav=e.target.closest("nav button");
  if(nav){S.tab=nav.getAttribute("data-tab");S.confirm=null;S.pick.open=false;render();return;}
  const btn=e.target.closest("[data-act]");
  if(!btn)return;
  /* click adentro del popup: no lo cierro */
  if(btn.classList.contains("overlay")&&e.target.closest("[data-stop]"))return;
  const act=btn.getAttribute("data-act"), id=btn.getAttribute("data-id");
  switch(act){
    case"add":addEntry();break;
    case"saveEx":saveEx();break;
    case"cancelEx":cancelEx();render();break;
    case"editEx":{const ex=byId(id);S.lib={editingId:ex.id,name:ex.name,muscleGroup:ex.muscleGroup,type:ex.type,comments:ex.comments||""};S.libError="";S.confirm=null;render();window.scrollTo({top:0,behavior:"smooth"});break;}
    case"askDelEx":S.confirm="ex:"+id;render();break;
    case"delEx":
      S.exercises=S.exercises.filter(x=>x.id!==id);
      S.entries=S.entries.filter(x=>x.exerciseId!==id);
      if(S.lib.editingId===id)cancelEx();
      S.confirm=null;save();render();break;
    case"cancelConfirm":S.confirm=null;render();break;
    case"editEn":{const en=S.entries.find(x=>x.id===id);S.reg.editingId=id;S.reg.eAvg=en.avg!=null?en.avg:"";S.reg.eMax=en.max!=null?en.max:"";S.confirm=null;render();break;}
    case"cancelEn":S.reg.editingId="";render();break;
    case"saveEn":{
      const a=num(S.reg.eAvg),m=num(S.reg.eMax);
      if(a==null&&m==null)return;
      S.entries=S.entries.map(x=>x.id===id?{...x,avg:a,max:m}:x);
      S.reg.editingId="";save("en");render();break;}
    case"askDelEn":S.confirm="en:"+id;render();break;
    case"delEn":S.entries=S.entries.filter(x=>x.id!==id);S.confirm=null;save("en");render();break;
    case"regView":S.reg.view=id;S.reg.editingId="";S.confirm=null;render();break;
    case"prevMonth":S.reg.month=shiftMonth(S.reg.month,-1);S.reg.day="";S.confirm=null;render();break;
    case"nextMonth":S.reg.month=shiftMonth(S.reg.month,1);S.reg.day="";S.confirm=null;render();break;
    case"pickDay":S.reg.day=(S.reg.day===id?"":id);S.reg.editingId="";S.confirm=null;render();break;
    case"closeDay":S.reg.day="";S.reg.editingId="";S.confirm=null;render();break;
    case"openPick":{
      const mode=id||"form";
      const ex=byId(mode==="filter"?S.reg.filterId:S.form.exerciseId);
      S.pick={open:true,mode:mode,group:ex?ex.muscleGroup:(mode==="filter"?"":MUSCLE_GROUPS[0])};
      S.confirm=null;render();break;}
    case"closePick":S.pick.open=false;render();break;
    case"accGroup":S.pick.group=(S.pick.group===id?"":id);render();break;
    case"pickEx":{
      const v=(id==="__all")?"":id;
      if(S.pick.mode==="filter"){S.reg.filterId=v;S.reg.editingId="";}
      else{S.form.exerciseId=v;S.error="";}
      S.pick.open=false;S.confirm=null;render();break;}
    case"backup":backup();break;
    case"restore":$("#fileInput").click();break;
  }
});

/* ---------- respaldo ---------- */
function backup(){
  const blob=new Blob([JSON.stringify({v:1,exercises:S.exercises,entries:S.entries},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="gym-"+today()+".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function readBackup(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.exercises)||!Array.isArray(d.entries))throw 0;
      if(!confirm("Esto reemplaza tus datos actuales por los del respaldo. ¿Seguir?"))return;
      S.exercises=d.exercises;S.entries=d.entries;save();render();
    }catch(e){alert("El archivo no es un respaldo válido.");}
  };
  r.readAsText(file);
}

load();render();

/* ---------- service worker: la app queda disponible sin conexión ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(()=>{});});
}

</script>
